name: release

# Publishes on every push to main:
#   - image  ghcr.io/<owner>/t3code:<appVersion>, :<major.minor>, :latest (multi-arch, signed, SBOM)
#   - chart  oci://ghcr.io/<owner>/charts/t3code:<chart version> (only if not released yet)
# The weekly schedule rebuilds the image for base-image security updates
# (same tag, new digest); the chart is not re-released.

on:
  push:
    branches: [main]
    paths:
      - charts/**
      - image/**
      - .github/workflows/release.yaml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write # cosign keyless

concurrency:
  group: release
  cancel-in-progress: false

env:
  CHART_DIR: charts/t3code
  IMAGE: ghcr.io/${{ github.repository_owner }}/t3code
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.v.outputs.app }}
      minor: ${{ steps.v.outputs.minor }}
      chart: ${{ steps.v.outputs.chart }}
      chart_released: ${{ steps.v.outputs.chart_released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          app=$(awk -F'"' '/^appVersion:/{print $2}' "$CHART_DIR/Chart.yaml")
          chart=$(awk '/^version:/{print $2}' "$CHART_DIR/Chart.yaml")
          released=false
          if git rev-parse -q --verify "refs/tags/t3code-$chart" >/dev/null; then released=true; fi
          {
            echo "app=$app"
            echo "minor=${app%.*}"
            echo "chart=$chart"
            echo "chart_released=$released"
          } >> "$GITHUB_OUTPUT"

  image:
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: image
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          build-args: T3_VERSION=${{ needs.meta.outputs.app }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.meta.outputs.app }}
            ${{ env.IMAGE }}:${{ needs.meta.outputs.minor }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign image
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

  chart:
    needs: [meta, image]
    if: needs.meta.outputs.chart_released == 'false' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: sigstore/cosign-installer@v3
      - uses: oras-project/setup-oras@v1

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push chart
        id: push
        run: |
          helm package "$CHART_DIR" -d dist
          out=$(helm push "dist/t3code-${{ needs.meta.outputs.chart }}.tgz" "$CHART_REPO" 2>&1)
          echo "$out"
          digest=$(echo "$out" | awk '/^Digest:/{print $2}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign chart
        run: cosign sign --yes "${CHART_REPO#oci://}/t3code@${{ steps.push.outputs.digest }}"

      - name: Artifact Hub repository metadata
        run: |
          oras push "${CHART_REPO#oci://}/t3code:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CHART: ${{ needs.meta.outputs.chart }}
          APP: ${{ needs.meta.outputs.app }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          notes=$(cat <<EOF
          T3 Code **${APP}** · chart **${CHART}**

          \`\`\`bash
          helm upgrade --install t3 ${CHART_REPO}/t3code --version ${CHART} -n t3code --create-namespace
          \`\`\`

          Image: \`${IMAGE}:${APP}\` (\`${IMAGE_DIGEST}\`)
          Upstream: https://github.com/pingdotgg/t3code/releases/tag/v${APP}
          EOF
          )
          gh release create "t3code-${CHART}" "dist/t3code-${CHART}.tgz" \
            --title "t3code ${CHART} (T3 Code ${APP})" --notes "$notes" --target "${{ github.sha }}"
