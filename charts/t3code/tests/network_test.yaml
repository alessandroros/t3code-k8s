suite: networking
templates:
  - templates/service.yaml
  - templates/ingress.yaml
  - templates/httproute.yaml
  - templates/networkpolicy.yaml
release:
  name: t3
  namespace: t3code
tests:
  - it: renders a ClusterIP service and a headless service
    template: templates/service.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.type
          value: ClusterIP
        documentIndex: 0
      - equal:
          path: spec.clusterIP
          value: None
        documentIndex: 1

  - it: supports an internal LoadBalancer for VPN access
    template: templates/service.yaml
    documentIndex: 0
    set:
      service.type: LoadBalancer
      service.loadBalancerIP: 192.168.1.240
      service.loadBalancerSourceRanges: [10.8.0.0/24]
    asserts:
      - equal:
          path: spec.loadBalancerIP
          value: 192.168.1.240
      - contains:
          path: spec.loadBalancerSourceRanges
          content: 10.8.0.0/24

  - it: does not render ingress, route or netpol by default
    asserts:
      - hasDocuments:
          count: 0
        template: templates/ingress.yaml
      - hasDocuments:
          count: 0
        template: templates/httproute.yaml
      - hasDocuments:
          count: 0
        template: templates/networkpolicy.yaml

  - it: renders the ingress pointing at the service port
    template: templates/ingress.yaml
    set:
      ingress.enabled: true
      ingress.className: nginx
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 80

  - it: requires parentRefs for the HTTPRoute
    template: templates/httproute.yaml
    set:
      route.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: route.parentRefs is required when route.enabled is true

  - it: restricts egress to the public internet
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: true
    asserts:
      - contains:
          path: spec.policyTypes
          content: Egress
      - contains:
          path: spec.egress[1].to[0].ipBlock.except
          content: 10.0.0.0/8
      - equal:
          path: spec.egress[1].to[1].ipBlock.cidr
          value: ::/0

  - it: only restricts ingress when egress restriction is off
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: true
      networkPolicy.egress.restrict: false
    asserts:
      - notContains:
          path: spec.policyTypes
          content: Egress
      - notExists:
          path: spec.egress
