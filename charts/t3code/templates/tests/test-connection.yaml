apiVersion: v1
kind: Pod
metadata:
  name: {{ include "t3code.fullname" . }}-test
  namespace: {{ .Release.Namespace }}
  # Not the selector labels: the NetworkPolicy would select this pod too and
  # its egress rules would block the in-cluster Service.
  labels:
    helm.sh/chart: {{ include "t3code.chart" . }}
    app.kubernetes.io/name: {{ include "t3code.name" . }}-test
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: t3code
  annotations:
    helm.sh/hook: test
    # Keep the pod after success so `helm test --logs` can read it (Helm 3 fails otherwise).
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: {{ .Values.tests.image }}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      command: ["sh", "-c"]
      args:
        - |
          set -e
          url="http://{{ include "t3code.fullname" . }}:{{ .Values.service.port }}/api/auth/session"
          echo "GET $url"
          body="$(curl -fsS --retry 10 --retry-delay 3 --retry-connrefused "$url")"
          echo "$body"
          echo "$body" | grep -q '"auth"'
