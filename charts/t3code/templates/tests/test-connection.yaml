apiVersion: v1
kind: Pod
metadata:
  name: {{ include "t3code.fullname" . }}-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "t3code.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: {{ .Values.tests.image }}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      command: ["sh", "-c"]
      args:
        - |
          set -e
          url="http://{{ include "t3code.fullname" . }}:{{ .Values.service.port }}/api/auth/session"
          echo "GET $url"
          body="$(curl -fsS --retry 10 --retry-delay 3 --retry-connrefused "$url")"
          echo "$body"
          echo "$body" | grep -q '"auth"'
