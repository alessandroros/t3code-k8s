{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "t3code.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "t3code.labels" . | nindent 4 }}
  {{- with include "t3code.annotations" (dict "root" . "extra" .Values.serviceAccount.annotations) }}
  {{- . | nindent 2 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
