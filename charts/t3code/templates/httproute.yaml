{{- if .Values.route.enabled -}}
{{- if not .Values.route.parentRefs }}
{{- fail "route.parentRefs is required when route.enabled is true" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "t3code.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "t3code.labels" . | nindent 4 }}
  {{- with include "t3code.annotations" (dict "root" . "extra" .Values.route.annotations) }}
  {{- . | nindent 2 }}
  {{- end }}
spec:
  parentRefs:
    {{- tpl (toYaml .Values.route.parentRefs) $ | nindent 4 }}
  {{- with .Values.route.hostnames }}
  hostnames:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "t3code.fullname" . }}
          port: {{ .Values.service.port }}
      {{- with .Values.route.matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.route.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
